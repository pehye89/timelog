<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeLog</title>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    </style>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <!-- Header -->
    <header class="main-header">
        <div class="header-left">
            <div class="brand">TimeLog.</div>
            <nav class="nav-tabs">
                <button class="tab-btn active" id="tabBtnTracker" onclick="switchTab('tracker')">타이머</button>
                <button class="tab-btn" id="tabBtnManagement" onclick="switchTab('management')">운영 관리</button>
                <button class="tab-btn" id="tabBtnWeekly" onclick="switchTab('weekly')">주간보고</button>
            </nav>
        </div>
        <div class="header-right">
            <button class="btn-ghost btn-ghost--sm" onclick="exportData()">내보내기</button>
            <button class="nav-arrow icon-btn" onclick="openModal('settingsModal')" title="설정">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
        </div>
    </header>

    <!-- [TAB 1] Tracker -->
    <div id="tabTrackerView">
        <div class="date-header">
            <button class="nav-arrow" onclick="changeDate(-1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
			<div class="date-nav-group">
				<div id="visualDateText" class="date-display" onclick="document.getElementById('hiddenDateInput').showPicker()"></div>
				<button class="btn-ghost btn-ghost--xs" onclick="goToToday()">오늘</button>
				<input type="date" id="hiddenDateInput" class="hidden" onchange="handleDateChange(this.value)">
			</div>
            <button class="nav-arrow" onclick="changeDate(1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>

        <div class="section-box section-box--timeline">
            <div class="flex-between mb-sm">
                <h3 class="section-eyebrow">Timeline</h3>
                <div>
                    <label class="checkbox-label">
                        <input type="checkbox" id="hideUnexecutedTimeline" onchange="renderHistory()"> 미실행 숨기기
                    </label>
                </div>
            </div>
            <div class="timeline-scroll" onmouseleave="endPaint(true)">
                <div class="timeline-container" id="ganttContainer">
                    <div class="time-ticks" id="ganttHeaderTicks"></div>
                    <div id="ganttRows"></div>
                </div>
            </div>
        </div>

        <div class="split-grid">
            <div class="section-box">
                <div class="list-header">
                    <h3>운영 목록</h3>
                    <button class="btn-text" onclick="openModal('addJobModal')">+ 추가</button>
                </div>
                <div id="jobPresetList"></div>
                <div id="emptyJobMsg" class="empty-state hidden">
                    등록된 운영 단위가 없습니다.
                </div>
            </div>

            <div>
                <div class="section-box">
                    <div class="timer-hero">
                        <div class="status-badge" id="timerBadge"><span class="pulse"></span><span id="timerBadgeText">대기 중</span></div>
                        <div class="timer-digits" id="timerDisplay">00:00:00</div>
                        <div id="activeJobTitle" class="active-job-title">선택된 운영 없음</div>
                    </div>
                    
                    <div class="form-group form-group--tight">
                        <div id="sessionBullets"></div>
                    </div>

                    <div class="flex-end">
                        <button class="btn-solid btn-solid--sm" id="stopBtn" onclick="stopAndSaveTimer()" disabled>
                            기록 저장 및 종료
                        </button>
                    </div>
                </div>

                <div class="section-box">
                    <div class="list-header">
                        <h3>타임로그</h3>
                        <button class="btn-text" onclick="openModal('manualAddModal')">+ 추가</button>
                    </div>
                    <div id="historyContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- [TAB 2] Operation Management -->
    <div id="tabManagementView" class="hidden">
        <div class="folder-tabs">
            <button class="folder-tab active" id="mgmtTabActive" onclick="switchMgmtTab('active')">진행 중</button>
            <button class="folder-tab" id="mgmtTabCompleted" onclick="switchMgmtTab('completed')">완료됨</button>
        </div>
        <div class="section-box folder-content-box">
            <div class="flex-between mb-xl">
                <h3 id="mgmtTitle" class="mb-0">진행 중인 운영</h3>
                <div class="flex-row flex-gap-sm">
                    <button class="btn-ghost btn-ghost--sm" onclick="toggleAllManagement(true)">모두 펴기</button>
                    <button class="btn-ghost btn-ghost--sm" onclick="toggleAllManagement(false)">모두 접기</button>
                    <button class="btn-text" onclick="openModal('addJobModal')">+ 추가</button>
                </div>
            </div>
            
            <div id="jobManagementContainer"></div>
            <div id="jobManagementPagination" class="pagination"></div>
        </div>
    </div>

    <!-- [TAB 3] Reports (주간보고) -->
    <div id="tabWeeklyView" class="hidden">
        <div class="date-header date-header--tight">
            <button class="nav-arrow" onclick="changeWeek(-1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
			<div class="date-nav-group">
				<div id="weeklyDateRangeText" class="date-display"></div>
				<button class="btn-ghost btn-ghost--xs" onclick="goToWeeklyToday()">오늘</button>
			</div>
            <button class="nav-arrow" onclick="changeWeek(1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>

        <div class="split-grid">
            <div class="section-box">
                <div class="list-header">
                    <h3>금주요약</h3>
                </div>
                <div id="weeklySummaryContainer"></div>
                <div id="weeklySummaryEmptyMsg" class="empty-state hidden">
                    이번 주 기록이 없습니다.
                </div>
            </div>

            <div class="section-box">
                <div class="list-header">
                    <h3>운영별 상세</h3>
                    <div class="flex-row flex-gap-sm">
                        <button class="btn-ghost btn-ghost--sm" onclick="toggleAllWeekly(true)">모두 펴기</button>
                        <button class="btn-ghost btn-ghost--sm" onclick="toggleAllWeekly(false)">모두 접기</button>
                    </div>
                </div>
                <div id="weeklyContainer"></div>
            </div>
        </div>
    </div>

    <footer class="footer">
        Made by Eunhye.
    </footer>
</div>

<!-- MODALS -->
<!-- Settings Modal -->
<div class="modal-bg" id="settingsModal">
    <div class="modal-box">
        <div class="flex-between mb-md">
            <div class="modal-header modal-header--flush">환경 설정</div>
            <div>
                <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="handleImport(event)">
                <button class="btn-ghost btn-ghost--sm" onclick="triggerImport()">가져오기</button>
            </div>
        </div>
        
        <div class="grid-2">
            <div class="form-group">
                <label>테마 모드</label>
                <select id="settingTheme"><option value="light">라이트 (Light)</option><option value="dark">다크 (Dark)</option></select>
            </div>
            <div class="form-group">
                <label>타임라인 구간 단위</label>
                <select id="roundSetting">
                    <option value="5">5분 단위</option>
                    <option value="10" selected>10분 단위</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>메인 테마 색상 (버튼 및 강조색)</label>
            <div class="flex-row flex-gap-md">
                <input type="color" class="color-picker-square" id="settingMainColor" onchange="handleMainColorChange(this.value)">
                <span id="settingMainColorText" class="text-sm text-muted">#0f172a</span>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group"><label>업무 시작</label><input type="time" id="settingWorkStart"></div>
            <div class="form-group"><label>업무 종료</label><input type="time" id="settingWorkEnd"></div>
            <div class="form-group"><label>점심 시작</label><input type="time" id="settingLunchStart"></div>
            <div class="form-group"><label>점심 종료</label><input type="time" id="settingLunchEnd"></div>
        </div>
        
        <div class="form-group mt-md">
            <label>색상 팔레트</label>
            <div id="paletteOptions" class="palette-options"></div>
            <div class="mt-lg">
                <label class="label--tight">선택한 팔레트 색상 직접 수정</label>
                <div class="flex-row-wrap">
                    <input type="color" class="color-picker-square" id="pal1">
                    <input type="color" class="color-picker-square" id="pal2">
                    <input type="color" class="color-picker-square" id="pal3">
                    <input type="color" class="color-picker-square" id="pal4">
                    <input type="color" class="color-picker-square" id="pal5">
                    <input type="color" class="color-picker-square" id="pal6">
                </div>
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn-ghost" onclick="closeModal('settingsModal')">취소</button>
            <button class="btn-solid" onclick="saveSettings()">저장</button>
        </div>
    </div>
</div>

<!-- Add Operation Modal -->
<div class="modal-bg" id="addJobModal">
    <div class="modal-box">
        <div class="modal-header">새 운영 추가</div>
        <div class="grid-2">
            <div class="form-group"><label>운영 번호</label><input type="text" id="newOpsCode" placeholder="예: OP-101"></div>
            <div class="form-group"><label>운영명</label><input type="text" id="newOpsName" placeholder="예: 유지보수"></div>
            <div class="form-group"><label>작업 코드</label><input type="text" id="newTaskCode" placeholder="예: TK-1234"></div>
            <div class="form-group"><label>작업명</label><input type="text" id="newTaskName" placeholder="예: 메인 화면 UI 수정"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-ghost" onclick="closeModal('addJobModal')">취소</button>
            <button class="btn-solid" onclick="saveNewJob()">추가하기</button>
        </div>
    </div>
</div>

<!-- Edit Operation Modal -->
<div class="modal-bg" id="editJobModal">
    <div class="modal-box">
        <div class="modal-header">운영 정보 수정</div>
        <input type="hidden" id="editJobId">
        <div class="grid-2">
            <div class="form-group"><label>운영 번호</label><input type="text" id="editOpsCode"></div>
            <div class="form-group"><label>운영명</label><input type="text" id="editOpsName"></div>
            <div class="form-group"><label>작업 코드</label><input type="text" id="editTaskCode"></div>
            <div class="form-group"><label>작업명</label><input type="text" id="editTaskName"></div>
            <div class="form-group"><label>시작일</label><input type="date" id="editJobStartDate"></div>
            <div class="form-group"><label>완료일</label><input type="date" id="editJobEndDate"></div>
        </div>
        
        <div class="form-group mt-sm">
            <label>운영 대표 색상 선택</label>
            <div class="flex-row-wrap">
                <div id="editJobPaletteSwatches" class="flex-row flex-gap-sm"></div>
                <div class="rainbow-picker" title="사용자 지정 색상">
                    <input type="color" id="editJobColorPicker" onchange="setCustomJobColor(this.value)">
                </div>
                <span id="editJobColorText" class="text-sm text-muted fw-bold"></span>
            </div>
        </div>

        <div class="modal-actions--split">
            <button class="btn-danger-ghost" onclick="deleteJobFromEditModal()">삭제</button>
            <div class="flex-row flex-gap-md">
                <button class="btn-ghost" onclick="closeModal('editJobModal')">취소</button>
                <button class="btn-solid" onclick="saveEditJob()">수정 완료</button>
            </div>
        </div>
    </div>
</div>

<!-- Manual Add Log Modal -->
<div class="modal-bg" id="manualAddModal">
    <div class="modal-box">
        <div class="modal-header">타임로그 추가</div>
        <div class="form-group"><label>운영 선택</label><select id="manualAddJob"></select></div>
        <div class="form-group"><label>날짜</label><input type="date" id="manualAddDate"></div>
        <div class="grid-2">
            <div class="form-group"><label>시작 시간</label><input type="time" id="manualAddStart"></div>
            <div class="form-group"><label>종료 시간</label><input type="time" id="manualAddEnd"></div>
        </div>
        <div class="form-group"><label>내용</label><div id="manualAddBullets"></div></div>
        <div class="modal-actions">
            <button class="btn-ghost" onclick="closeModal('manualAddModal')">취소</button>
            <button class="btn-solid" onclick="saveManualAddModal()">기록 추가</button>
        </div>
    </div>
</div>

<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/storage.js"></script>
<script src="js/settings.js"></script>
<script src="js/tracker.js"></script>
<script src="js/history.js"></script>
<script src="js/timeline.js"></script>
<script src="js/management.js"></script>
<script src="js/weekly.js"></script>
<script src="js/modals.js"></script>
<script src="js/app.js"></script>
</body>
</html>
